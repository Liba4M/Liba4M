<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Liba Mahmood — Computer Science Graduate, Technology Consultant, Data &amp; AI">
  <defs>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#b3294f" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#b3294f" stop-opacity="0"/>
    </radialGradient>
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2226" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="#121013"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <g font-family="'JetBrains Mono', Consolas, monospace" fill="#3a2a30" opacity="0.55" font-size="13">
    <text x="1100" y="34">01</text>
    <text x="1100" y="54">{ }</text>
    <text x="1100" y="74">&lt;/&gt;</text>
    <text x="1100" y="94">10</text>
    <text x="1100" y="114">#</text>
    <text x="1140" y="44">$</text>
    <text x="1140" y="64">01</text>
    <text x="1140" y="84">*</text>
    <text x="1140" y="104">[ ]</text>
    <text x="60" y="240">10</text>
    <text x="60" y="260">{ }</text>
  </g>

  <g transform="translate(40,36)">
    <rect width="300" height="26" rx="8" fill="#1a1719" stroke="#b3294f" stroke-opacity="0.35"/>
    <circle cx="16" cy="13" r="5" fill="#b3294f"/>
    <circle cx="34" cy="13" r="5" fill="#6e6b74"/>
    <circle cx="52" cy="13" r="5" fill="#4a444a"/>
    <text x="70" y="17" font-family="Consolas, monospace" font-size="11" fill="#8a8390">liba@github: ~ — zsh</text>
  </g>

  <text x="600" y="158" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="66" font-weight="700" fill="#f1eef0" filter="url(#textGlow)">Liba Mahmood</text>

  <text x="600" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#b9b3ba">Computer Science Graduate<tspan fill="#b3294f"> :: </tspan>Technology Consultant<tspan fill="#b3294f"> :: </tspan>Data &amp; AI</text>

  <text x="40" y="262" font-family="Consolas, monospace" font-size="14" fill="#8a8390">$ <tspan fill="#d1617e">whoami</tspan></text>
  <text x="40" y="284" font-family="Consolas, monospace" font-size="14" fill="#f1eef0">Turning tangled problems into working code, one commit at a time.</text>
</svg>
